# Project A, list t1 (A2): Tier 1, the driver as games drive it, on the
# synthetic discs (the bench's fixtures/synth, MANIFEST.txt). One case a
# test, ten runs each; T1.EXE (dos/src/t1) writes PASS or FAIL and the
# INT 1Ah tick at every audio request to C:\OUT\T1.TXT and beeps at its
# start so the capture can be aligned; the audio cases record (one at a
# time, L6) and runs/rec/tonecheck.py judges them. Under C2 every case;
# under C1 (pinC1, the CD-only build) the data-path subset. A todo says
# what a case lacks before it can run.

