note = "the virtual SB Pro's 8-bit stereo high-speed auto-init, the guide's procedure (SBG:1930-2034): D1h, mixer 0Eh's stereo switch on (bit 1), one silent byte by 14h with its interrupt, the time constant for two channels (40h: E9h for 22050 Hz, D2h for 11025, the high byte of 65536 - 256000000/(2 x rate), VSB:287-289, the SB Pro counting it as the formula has it, VSB:302-304: 21739.1 and 10869.6 Hz a channel), the output filter off (0Eh bit 5), 48h, 90h, steps ST11 and ST22 (3.xx stereo high speed at 11025 and 22050 Hz only, SBG:1418-1430); buffers of 0.2 s holding 400 whole cycles of a 2 kHz tone in the left channel, 80h in the right; each step two interrupts or more, then a DSP reset, the only way out of high-speed mode (SBG:2001, 2032-2034), answered AAh, and no interrupt after it; mixer 0Eh back to mono. tonecheck: the tone right, the left silent: the guide read literally, the silent byte is the first byte and goes left, so the data's first byte goes right (SBG:2394-2396, 1954-1960), as both emulators do (EMUSRC: 86Box src/sound/snd_sb_dsp.c at 6311adc (the byte toggle reset to the right at every DMA start; sbleftright_default 0); DOSBox-X src/hardware/sblaster.cpp at 97ff66a (an odd byte carried into the next transfer; remain_size cleared only in DSP_Reset)); grade emulator, hardware UNCONFIRMED (Michael, 26 Oct 2026, question 16); no gap of 20 ms or more (A3, C0: 86Box's own SB Pro v2; the client validated before C2)"

