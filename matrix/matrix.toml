# Areas: a change to these paths needs these groups (and tests), varied
# over these axes. "full" axes are covered in every combination; the rest
# pairwise. A code path no area names gets the fallback groups.
[fallback]
groups = ["probes", "families"]

[[area]]
name = "virtual card"
paths = ["src/audio/trap.asm", "src/audio/ess/*", "src/audio/ess_fifo.asm",
         "src/audio/sb_adpcm.asm", "src/audio/sb_mixer.asm", "src/audio/sb_patch.asm",
         "src/audio/sb_state.inc", "src/audio/wss_codec.asm", "src/audio/wss_state.inc",
         "src/audio/wss_input.inc", "src/audio/high_dma.asm", "src/audio/direct_*.asm",
         "src/audio/ports.inc"]
groups = ["probes", "families"]
vary = ["vmodel"]

[[area]]
name = "interrupts"
paths = ["src/audio/irq.asm", "src/audio/background.asm", "src/host/pic.asm",
         "src/host/interrupts.asm", "src/host/vectors.asm"]
groups = ["irq", "families", "host", "midi"]
vary = ["pirq", "virq", "vmodel"]
full = ["pirq", "virq"]
cover = ["client"]

[[area]]
name = "physical output"
paths = ["src/audio/sb16.asm", "src/audio/pro_output.asm", "src/audio/wss_output.asm",
         "src/audio/speaker.asm", "src/platform.asm"]
groups = ["probes", "families", "midi"]
vary = ["pirq", "build"]

[[area]]
name = "mixer and stream"
paths = ["src/audio/mix.asm", "src/audio/mix_run.asm", "src/audio/mix_verify.asm",
         "src/audio/mixer.asm", "src/audio/cd_resample.asm", "src/audio/deemphasis.asm",
         "src/audio/stream.asm"]
groups = ["mixer", "families"]
vary = ["build", "vmodel"]

[[area]]
name = "CD and MSCDEX"
paths = ["src/audio/mounted.asm", "src/audio/disk_cache.asm", "src/driver.asm", "src/cue.asm",
         "src/mdm.asm", "src/mdm_helper.asm", "src/disc.inc", "src/disk_scan.asm"]
groups = ["cd", "families"]

[[area]]
name = "step aside"
paths = ["src/audio/standby.asm", "src/audio/pairing.asm"]
groups = ["probes", "families"]
vary = ["vmodel"]
todo = "a step-aside test that allows mode free: the transitions, IVT, PIC, DMA and mixer byte for byte"

[[area]]
name = "DPMI host"
paths = ["src/host/*"]
groups = ["host", "irq"]
cover = ["client"]

[[area]]
name = "install and resident"
paths = ["src/ucdd.asm", "src/helper.asm", "src/config_path.asm", "src/notice.inc",
         "src/audio/host_jemm.asm", "src/audio/host_jemm_init.asm", "src/audio/resident*.asm",
         "src/audio/layout.inc", "src/audio/config.asm", "src/audio/configure.asm",
         "src/audio/guest_config.asm", "src/audio/pm_bridge.inc", "src/audio/profile.inc",
         "src/audio/sb_state.inc", "src/audio/wss_state.inc"]
groups = ["probes", "families", "host"]

[[area]]
name = "UCDDSET"
paths = ["src/setup.asm", "src/setup/*"]
groups = ["probes"]
todo = "UCDDSET's own checks: the Test at IRQ 5 and 7, the display adapters, UCDD.CFG versions"

[[area]]
name = "UCDDPLAY"
paths = ["src/play.asm", "src/play/*"]
groups = []
todo = "playcheck compare and fuzz against the base revision"

[[area]]
name = "sound check"
# No source paths: the standard regression asks for it by name (regress.sh
# list c): every family game on every card model it allows, through sndreg.
paths = []
groups = ["families"]
vary = ["vmodel"]

[[area]]
name = "build script"
paths = ["scripts/build.py"]
groups = ["core"]
vary = ["build"]

# Sound engine families (mantra rule 10: fix by family, not by game). The
# library on the sound-engine-library branch is the source: page is the
# family's page in docs/sound-engines, which must name a finding before its
# fix (the hook checks); census lists its sections in census.md, surveyed as
# one traced game per driver version; inventory lists its names in the Engine
# column of inventory.md, for engines built into the game, which have no
# driver file (every traced game is surveyed). survey: the census files a
# family survey runs by default (the digital drivers); --driver picks others.
[library]
refs = ["HEAD", "sound-engine-library", "origin/sound-engine-library"]
dir = "docs/sound-engines"

[families.miles]
page = "miles.md"
census = ["Miles MSS 3, digital", "Miles MSS 3, music", "Miles AIL 2"]
survey = ["SB16.DIG", "SBPRO.DIG", "SBLASTER.DIG", "SBDIG.ADV", "SBPDIG.ADV"]
inventory = ["Miles MSS 3", "Miles AIL 2", "Miles AIL/32", "Miles"]

[families.hmi-sos]
page = "hmi-sos.md"
census = ["HMI SOS"]
survey = ["HMIDRV.386"]
inventory = ["HMI SOS"]

[families.digpak]
page = "digpak.md"
census = ["DigPak / MidPak"]
survey = ["SOUNDRV.COM"]
inventory = ["DigPak/MidPak"]

[families.sierra-sci]
page = "sierra-sci.md"
census = ["Sierra SCI"]
survey = ["AUDBLAST.DRV", "SNDBLAST.DRV"]
inventory = ["Sierra SCI"]

[families.creative]
page = "creative.md"
census = ["Creative"]
survey = ["CT-VOICE.DRV"]
inventory = ["Creative drv"]

[families.dmx]
page = "dmx.md"
inventory = ["DMX"]

[families.apogee]
page = "apogee.md"
inventory = ["Apogee SS"]

[families.lucasarts]
page = "lucasarts.md"
inventory = ["iMUSE"]

[families.others]
page = "others.md"
inventory = ["DSMI", "MIDAS", "Allegro", "Loudness SS", "MicroProse", "Sound Images",
             "DiamondWare", "AdLib driver", "CMS"]

[families.own-code]
page = "own-code.md"
inventory = ["own: SB + AdLib", "own: SB"]

# What a survey run of a driver file is set to: the card model whose driver
# it is. Files not named here run at the defaults.
[census_files]
"SBPRO.DIG" = { vmodel = "pro" }
"SBLASTER.DIG" = { vmodel = "sb2" }
"SBDIG.ADV" = { vmodel = "sb2" }
"SBPDIG.ADV" = { vmodel = "pro" }

# Where the census's folder name is not the launcher's. game_live.py takes
# the first numbered launcher of a folder by itself (DUNGKEEP: DUNGKE01).
[launchers]
DUNGKEEP = "DUNGKE01"
