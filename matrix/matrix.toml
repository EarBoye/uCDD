# The uCDD test matrix: one definition of what a test run can be set to,
# which tests exist, and which tests a change to which files needs.
#
# plan.py reads it to turn a diff into a list of runs; regress.sh and
# sndreg are meant to read it too (plan.py load(), or "plan.py ... --format
# tsv"), so that the lists in regress.sh, MODELS in sndreg/games.py and
# fixtest.SOUNDS stop being separate definitions.
#
# Seeded on 20 Oct 2026 from the code at irq-counters a544f38 and
# sound-engine-library b198237 and from the bench's own report. Lines
# marked "check" are the seed's best reading and need the bench's word.

version = 1

# Every value an axis can take.
[axes]
physical = ["sb16", "es1688"]
pirq = [5, 7]
vmodel = ["sb16", "pro", "sb2", "ess"]
virq = [5, 7]
# engaged: uCDD held on (lesson L7). base: no uCDD, the bench's own card of
# the model, for references. free: uCDD may step aside.
mode = ["engaged", "base", "free"]
midi = ["off", "gm"]
# Which kind of program the test runs. A property of the test, not set by
# the bench; the planner reports which clients a plan covers.
client = ["real", "dos4gw", "dpmi16"]
build = ["p32", "p128", "p256", "verify32", "verify128", "ess32", "ess128", "pinC1", "pinC2", "l4boot"]

# Kept here, left out of every plan until taken off this list: the ESS work
# is parked (20 Oct).
[parked]
physical = ["es1688"]
vmodel = ["ess"]
build = ["ess32", "ess128"]

# Used only by a test that names them in its own allow or fixed lists.
[opt_in]
mode = ["base", "free"]
# pinC1, pinC2: Project A's pinned build (A0); l4boot: its planted fault.
build = ["verify32", "verify128", "pinC1", "pinC2", "l4boot"]

# A run takes these unless its test or a varied axis sets them. The PC's
# card: an SB16 (CT2290) at 220h, IRQ 5, DMA 1 and 5.
[defaults]
physical = "sb16"
pirq = 5
vmodel = "sb16"
virq = 5
mode = "engaged"
midi = "off"
client = "real"
# 32 frames for all testing (Michael, 22 Oct 2026); 128 and 256 only as
# named comparisons.
build = "p32"

# Conditional defaults, in order, for axes nothing else has set: the older
# models' line as Michael set it (20 Oct).
[[default]]
when = { vmodel = ["pro", "sb2"] }
set = { virq = 7 }

[[constraint]]
why = "the ESS build presents only the virtual ESS (config.asm)"
when = { build = ["ess32", "ess128"] }
need = { vmodel = ["ess"] }

[[constraint]]
why = "a virtual ESS only on a physical ESS (UCDDSET, virtual_model_list)"
when = { vmodel = ["ess"] }
need = { physical = ["es1688"], build = ["ess32", "ess128"] }

[[constraint]]
why = "General MIDI goes to the wavetable header on the physical SB16"
when = { midi = ["gm"] }
need = { physical = ["sb16"] }

# The words the runners put on their command lines.
[words.mode]
engaged = "ucdd"
free = "ucdd"
base = "jemm"
# fixtest.py's --vmodel numbers
[words.vmodel]
sb16 = "0"
pro = "1"
sb2 = "3"
ess = "4"
# fixtest.py's card options: 86Box's card (--sound) and UCDD.CFG's (--card);
# without --sound fixtest uses the template's ES1688
[words.physical]
sb16 = "--sound sb16 --card sb16"
es1688 = "--card essfast"

# The environment each value sets: game_live.py, sndreg and probe_test.py
# read GL_IRQ, GL_VIRQ, GL_VMODEL and GL_CFG_V4 (always,fast); fixtest.py
# reads RIG_CFG_V4 and takes the IRQs as --irq (its runner below). Checked
# against the bench, 20 Oct.
[env.pirq]
"*" = "GL_IRQ={}"
[env.virq]
"*" = "GL_VIRQ={}"
[env.vmodel]
sb16 = "GL_VMODEL=0"
pro = "GL_VMODEL=1"
sb2 = "GL_VMODEL=3"
ess = "GL_VMODEL=4"
[env.mode]
engaged = "GL_CFG_V4=1,0 RIG_CFG_V4=1,0"
free = "GL_CFG_V4=0,0 RIG_CFG_V4=0,0"
base = "GL_MODE=base"
[env.midi]
gm = "GL_MIDI=1"

# What each build is: the options bset.sh passes (every build has
# --no-refill-hint), and the directory it puts the build in. $UCDD_TREE (the
# uCDD worktree) and $UCDD_SUFFIX (bset.sh's suffix) are set by the caller.
# Checked against runs/bset.sh, 20 Oct.
[builds]
p32 = "--resident-audio --no-refill-hint --audio-period-frames 32"
p128 = "--resident-audio --no-refill-hint --audio-period-frames 128"
p256 = "--resident-audio --no-refill-hint --audio-period-frames 256"
verify32 = "--resident-audio --no-refill-hint --audio-period-frames 32 --verify-mix"
verify128 = "--resident-audio --no-refill-hint --audio-period-frames 128 --verify-mix"
ess32 = "--resident-audio --no-refill-hint --audio-period-frames 32 --virtual-ess"
ess128 = "--resident-audio --no-refill-hint --audio-period-frames 128 --virtual-ess"
# Project A's pinned build, count-position 7994cd1 (A0; the bench's
# fixtures/pinned/MANIFEST.txt, $UCDD_TREE = fixtures/pinned): the audio
# build (C2) and the CD-only build (C1). l4boot is the planted fault for the
# boot check: pinC2's build with UCDD.EXE cut to 4096 bytes, never committed
# ($UCDD_TREE = runs/src).
pinC2 = "--resident-audio --no-refill-hint --audio-period-frames 32"
pinC1 = "--no-refill-hint --audio-period-frames 32"
l4boot = "--resident-audio --no-refill-hint --audio-period-frames 32"

[build_dirs]
p32 = "$UCDD_TREE/build_32$UCDD_SUFFIX"
p128 = "$UCDD_TREE/build_128$UCDD_SUFFIX"
p256 = "$UCDD_TREE/build_256$UCDD_SUFFIX"
verify32 = "$UCDD_TREE/build_v32$UCDD_SUFFIX"
verify128 = "$UCDD_TREE/build_v128$UCDD_SUFFIX"
ess32 = "$UCDD_TREE/build_32${UCDD_SUFFIX}_ess"
ess128 = "$UCDD_TREE/build_128${UCDD_SUFFIX}_ess"
pinC2 = "$UCDD_TREE/C2_32$UCDD_SUFFIX"
pinC1 = "$UCDD_TREE/C1_32$UCDD_SUFFIX"
l4boot = "$UCDD_TREE/l4_boot_32$UCDD_SUFFIX"

[run]
# Probes may share the machine; a recording never does (lesson L6).
probe_parallel = 7
# Groups only --group brings in: runs on the PC are Michael's evenings; the
# Project A lists (below, before the tests) run when their gate asks.
optional_groups = ["pc", "t0", "t1", "t2x", "sweep", "pinned", "t0l4", "t1l4"]

# How each runner is started, from the bench directory. $UCDD_FIXTEST is the
# bench's fixtest.py and $UCDD_KIT its kit folder (the caller sets both, as it
# sets $UCDD_TREE and $UCDD_SUFFIX). {name} is a run's value for an axis, {name_word} its word, {id} the
# run, {tag} the plan, {env} the environment above, {build_dir} the build's
# directory ([build_dirs]), {args} the test's own arguments. A run without
# uCDD (mode base) uses base_command where there is one; uCDD is then copied
# but not loaded, so any build directory does. Checked against the bench,
# 20 Oct.
[runner.probe]
# DOS tools in one boot; PROBE_RUN="TAG:PROGRAM ARGS,..." in the test's env
# (a "!" command goes into AUTOEXEC as it stands); output C:\OUT\TAG.TXT
kind = "probe"
command = "{env} python3 runs/probe_test.py {build_dir} {id} {vmodel} {mode_word}"
base_command = "{env} python3 runs/probe_test.py $UCDD_TREE/build_32$UCDD_SUFFIX {id} {vmodel} jemm"
[runner.probewav]
# probe_test.py recording sound.wav (PROBE_WAV=1): a recording, so one at a
# time (lesson L6). Project A's Tier 1 audio cases (A2), judged by
# plan_run.py with T1.EXE's line and runs/rec/tonecheck.py's.
kind = "recording"
command = "{env} python3 runs/probe_test.py {build_dir} {id} {vmodel} {mode_word}"
[runner.perf]
# the standard regression's SBT16 and verify rows: fixtest.py perf, steps
# "OUT:PROGRAM ARGS,..." in {args}; rsum.py compares them with a base run
kind = "probe"
command = "{env} python3 $UCDD_FIXTEST perf {build_dir} \"{args}\" {physical_word} --vmodel {vmodel_word} --irq {pirq}/{virq} --id {id}"
base_command = "{env} python3 $UCDD_FIXTEST perf $UCDD_TREE/build_32$UCDD_SUFFIX \"{args}\" {physical_word} --vmodel {vmodel_word} --irq {pirq}/{virq} --jemm --id {id}"
[runner.verify]
# the verify-mix build: fixtest.py perf --verify (MEMFIND dumps MIXVERIF after
# the steps); rsum.py's "verify rows" read the bad-sample counts
kind = "probe"
command = "{env} python3 $UCDD_FIXTEST perf {build_dir} \"{args}\" --verify {physical_word} --vmodel {vmodel_word} --irq {pirq}/{virq} --id {id}"
[runner.mpu]
kind = "probe"
command = "{env} python3 runs/mpu_test.py {build_dir} {id}"
[runner.game]
# NOT a judged runner: game_live.py only starts a live 86Box session, to be
# driven by hand (the bench's livebox.py). No test uses it; a game test runs
# through sndreg, which records and judges.
kind = "recording"
command = "{env} python3 runs/game_live.py {id} {build_dir} $GAMES/{library} {game}"
[runner.sndreg]
# records the game under the build and judges it against the stored
# references (the bench's sndref store); the game must be in runs/sndreg/games.py. The
# run's id is sndreg's tag: runs/sr_ID_MODEL_GAME, runs/sndreg_ID.txt
kind = "recording"
command = "{env} python3 runs/sndreg/sndreg.py check {build_dir} {id} -m {vmodel} {game}"
# without uCDD: recorded on 86Box's own card and judged against the stored
# references (refs makes new references; a plan never overwrites them)
base_command = "{env} python3 runs/sndreg/sndreg.py check - {id} --base -m {vmodel} {game}"
[runner.boot]
# Project A, A0: does a configuration boot to a game's launcher (the
# driver installed, G: assigned, the launcher reached); judged by itself
# (runs/ID/boot.json), recorded by plan_run.py. It records sound, so run
# with PROBES_AT_ONCE=1 (L6).
kind = "probe"
command = "{env} python3 runs/boot_run.py {id} {build_dir} $GAMES/{library} {game}"
[runner.pc]
kind = "hardware"
command = "on the PC with the kit of {build}: RUN {game}"

# Tests. groups: which area lists reach it ("core" runs for every code
# change). fixed: values the test always runs with. allow: the values it
# may be varied over (default: every value not parked or opt-in).
# findings: the rows it checks. repeat: runs per configuration, for faults
# that come and go. todo: what it lacks before it can run.

# Project A's lists (Michael's directive project_a.md, gate A0, 25 Oct
# 2026), empty until their gates add tests. A test joins a list through its
# groups; only --group brings a list in (run.optional_groups). Every run on
# count-position 7994cd1 at 32 frames, the pinned build.
#   t0     unit tests of the driver's pure logic (A1)
#   t1     driver conformance on synthetic discs (A2)
#   t2x    the Tier 2 cases beyond SBT16, SBPROBE and DMACNT (A3)
#   sweep  the library, every game (A6)
# and the group pinned: A0's boot proof of C0, C1 and C2 on the pinned
# build with one game, and its planted fault (BOOT-L4, a plan of its own).

[[test]]
name = "BOOT-C0"
runner = "boot"
game = "DUKE3D"
library = "DOS_ACT"
groups = ["pinned"]
fixed = { mode = "base", vmodel = "sb16" }
note = "C0, the control: 86Box's own card and drive, OAKCDROM and MSCDEX on G:, no uCDD"

[[test]]
name = "BOOT-C1"
runner = "boot"
game = "DUKE3D"
library = "DOS_ACT"
groups = ["pinned"]
fixed = { build = "pinC1", vmodel = "sb16" }
note = "C1, the CD-only build on G: through SHSUCDX"

[[test]]
name = "BOOT-C2"
runner = "boot"
game = "DUKE3D"
library = "DOS_ACT"
groups = ["pinned"]
fixed = { build = "pinC2", vmodel = "sb16" }
note = "C2, the audio build, both SB16s at 220/5/1/5, held on (L7)"

[[test]]
name = "BOOT-L4"
runner = "boot"
game = "DUKE3D"
library = "DOS_ACT"
groups = ["pinned"]
fixed = { build = "l4boot", vmodel = "sb16" }
note = "the planted fault: must FAIL the driver check before a BOOT pass means anything (L4)"

# Project A, list t0 (A1): Tier 0, the driver's pure logic, one case a
# test, ten runs each on the pinned build (A1: 10/10). Each NASM program
# (the bench's dos/src/t0/) includes the pinned worktree's modules unchanged
# and writes "PASS case" or "FAIL case detail" to C:\OUT\T0.TXT. The
# expected result is the pinned README's or the directive's, never the code's.
# A todo says what a case lacks before it can run.

[[test]]
name = "T0-CUE-ISO"
runner = "probe"
env = "PROBE_RUN='T0:T0CUE.COM ISO'"
groups = ["t0"]
fixed = { build = "pinC2", vmodel = "sb16" }
repeat = 10
secs = 60
note = "an .ISO path: 2048-byte sectors (README, Images: .ISO)"

