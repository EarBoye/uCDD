# Settings for the commit-msg hook (hooks/commit-msg). The matrix planner
# has its own file, matrix/matrix.toml.

[commit]
# A commit that touches one of these paths changes code and needs an
# Issue: trailer and Evidence: trailers. Anything else is a notes commit
# and is exempt. Patterns are shell globs; * also matches a /.
code = ["src/*", "scripts/build.py"]
# Branches the hook leaves alone (shell globs).
skip_branches = ["archive/*"]
# Rule 1: a code commit cites its document, or says the documents are
# silent ("Evidence: data sheet: silent; ...").
require_data_sheet = true
# Rule 10: a code commit names the sound engine family its fault belongs to
# ("Family: creative"), whose page in the library must already name the row,
# or says why it is no one family's ("Family: none: the host's EOI path").
# The families and the library are in matrix/matrix.toml.
require_family = true

# Evidence grades and the words accepted for each. The grade is what an
# Evidence: trailer starts with, up to the first colon or comma.
[grades]
hardware = ["hardware", "hw"]
emulator = ["emulator", "emu", "86box", "dosbox-x", "qemu", "trace"]
"data sheet" = ["data sheet", "datasheet", "doc", "spec"]
# Step 4 found no failing check: the fix stands on reading, and says so.
reading = ["reading"]
# No change in behaviour (comments, names, layout). The hook proves it by
# building the parent and the staged tree and comparing the binaries.
none = ["none"]

# Words that never go into a message or an added line (mantra rule 7: no
# test-bench nicknames). Python regular expressions.
[[banned]]
pattern = '(?i)\brig(86)?\b'
why = "no test-bench nicknames (mantra rule 7)"

# No local path in the repository (Michael, 20 Oct 2026): the bench's
# account name and directories stay on the bench, in method.local.toml.
[[banned]]
pattern = '(?i)/home/[a-z0-9_.-]+/|/Users/[A-Za-z0-9_.-]+/|\b[A-Z]:\\Users\\'
why = "a local path; keep it in method.local.toml, which git ignores"

# Nothing goes to the upstream author (Michael, 20 Oct 2026). A mention, or
# a link to one of his issues or pull requests, notifies him from a commit.
[[banned]]
pattern = '(?i)@vorvek\b|vorvek/ucdd(#\d+|/(issues|pull)/\d+)'
why = "it would notify the upstream author; nothing from this fork goes to him"

# We never ship, patch or alter game code (Michael, 20 Oct 2026). Any DOS
# game, as it was sold, must run with uCDD as it would on the real hardware:
# no patch to the game, no extra file and no setting for that game.
# Decompiled or traced game code is only a way to learn what a game expects
# of the hardware; the notes say it in words. The hook refuses a commit that
# adds a program or driver file, a file the census knows as a game's driver
# under any name, a disassembly listing, or a string naming a game in driver
# code (a special case). The guard refuses writes into the game library.
[games]
# The game library and its disc images on the bench: absolute paths. They
# are the bench's own and never committed: set them in method.local.toml,
# beside this file and ignored by git, or in UCDD_GAMES (os.pathsep apart).
paths = []
suffixes = [".exe", ".com", ".ovl", ".ovr", ".dig", ".mdi", ".adv", ".drv", ".386", ".dll",
            ".bin", ".cue", ".iso", ".img", ".ima", ".mdf", ".ccd", ".sub", ".voc", ".xmi",
            ".pak", ".vxd"]
# The project's own files with those suffixes.
allowed = ["src/play/assets.bin"]
# A line of a disassembly listing: an address, two or more bytes, a mnemonic.
listing = '^\s*(?:[0-9A-Fa-f]{4}:[0-9A-Fa-f]{4,8}|[0-9A-Fa-f]{8})\s+(?:[0-9A-Fa-f]{2}\s?){2,}\s+[a-z]{2,7}\b'
listing_lines = 3
# A decompiler's own names (Ghidra's FUN_0001a2b4, DAT_, undefined4,
# unaff_, in_AX): two in a commit is decompiled code pasted in.
decompiled = '\b(?:FUN|DAT|LAB|PTR|SUB|thunk_FUN)_[0-9a-fA-F]{4,}\b|\bundefined[1248]\b|\bunaff_\w+|\bin_[A-Z]{2,3}\b|\bextraout_\w+'
decompiled_hits = 2
# Driver code, where a game's name in a string would be a special case; the
# player's and the setup program's screens are not driver code.
driver_code = ["src/*"]
not_driver_code = ["src/play/*", "src/play.asm", "src/setup/*", "src/setup.asm"]
own_programs = ["UCDD.EXE", "UCDDSET.EXE", "UCDDPLAY.EXE", "COMMAND.COM"]

# What the guard keeps away from the upstream: pushes to his repository,
# pull requests, issues and comments there.
[upstream]
owner = "vorvek"
fork = "EarBoye/uCDD"

# The results ledger. The runners write it (tools/ledger.py record), the
# hook reads it: a plan named in an "Evidence: emulator:" line must be saved
# (plan.py --save), every one of its runs recorded as a pass, and the
# recorded binaries the ones this commit builds. With require on, every
# emulator line must name a plan; leave it off until the runners record.
# The path is relative to this directory unless absolute; UCDD_LEDGER
# overrides it.
# Off from the 22 Oct rebuild, leaving every code commit after it with unverified evidence
# trailers. Tightening r3 gate T2 turns it on, the same commit that updates tests/test_method.py
# to the required regime (its sample messages must name a plan the test ledger holds). Until
# then the freeze covers it: no code commit is permitted at all. r3.1, 24 Oct 2026.
[ledger]
path = "ledger"
require = true

# Lesson L2: code on a shared path keeps what every path into it carries.
# A label whose comment names its incoming paths (the data-flow pass wrote
# them) is a join. A code commit that changes the code under one names it in
# a Paths: trailer, after checking every path into it against the comment.
# This is recall at the moment of the change, not evidence: the trailer is
# the author's word.
[joins]
files = ["*.asm", "*.inc"]
marker = '(?i)\b(joined from|called (from|with)|far entry|on (both|every|each) paths?)\b'

# Where an Issue: row must already be committed: the notes branch and the
# sound-engine library (tightening r3.3, T1: the ISSUES.md copies on the
# code branches are frozen; spec-first is no longer read). HEAD stays: the
# self-tests commit their rows on the fixture's own HEAD, and without it 21
# of the 67 fail. A ref that does not exist here is skipped.
[rows]
refs = ["HEAD", "notes", "origin/notes", "sound-engine-library", "origin/sound-engine-library"]
paths = ["ISSUES.md", "docs/*.md"]

# The builds compared for "Evidence: none". The bset.sh variants, with the
# options bset.sh passes (every one has --no-refill-hint; checked 20 Oct).
[identical]
variants = [
    "--resident-audio --no-refill-hint --audio-period-frames 32",
    "--resident-audio --no-refill-hint --audio-period-frames 128",
    "--resident-audio --no-refill-hint --audio-period-frames 256",
    "--resident-audio --no-refill-hint --audio-period-frames 128 --verify-mix",
    "--resident-audio --no-refill-hint --audio-period-frames 32 --virtual-ess",
    "--resident-audio --no-refill-hint --audio-period-frames 128 --virtual-ess",
]
compare = ["*.EXE", "*.BIN", "*.COM"]

# The checks on GitHub (tools/ci.py, run by the workflow on fixes). Every
# branch head is built with the [identical] variants and its headroom
# reported. Commits made after check_after (an ISO date, such as
# "2026-10-21T00:00:00+11:00"; empty: none yet) get the hook's checks, apart
# from the ledger, which lives on the bench. Set it to the time the hook was
# installed: commits before that were never asked for trailers.
[ci]
check_after = "2026-10-20T13:14:06+11:00"
skip_branches = ["archive/*"]
# build.py's limits, against the sizes it prints: UCDD.EXE with its header
# must leave the host's overlay alone, the host fits a segment, UCDDPLAY's
# image keeps its stack word, UCDDSET's payload fits a segment.
limits = { "UCDD.EXE" = 65536, "UCDDHOST.BIN" = 65535, "UCDDPLAY.BIN" = 65534, "UCDDSET.EXE" = 65568 }

# ---- Added 24 Oct 2026 (tightening r3; Michael) ----


# Recall at the moment of change (guard/recall.py, a PreToolUse hook on
# Edit/Write/MultiEdit): what the notes already say about the file, ports,
# commands, labels and issue IDs being edited, shown once per file per
# session before the edit lands. Refs here are searched beside [rows].refs.
[recall]
refs = ["notes", "origin/notes"]
paths = ["ISSUES.md", "docs/*.md"]
lessons_tags = ["code", "fix"]
max_lines = 80
# r3.5: test sources and runners get recall too, with the reference documents searched
# for the edited region's ports, commands and terms. Globs relative to the repository
# that holds the file (the bench's own repository for its runs/ and dos/ trees).
test_paths = ["tests/*", "dos/src/*", "runs/*.py", "runs/sndreg/*.py", "runs/rec/*.py", "runs/src/method/tests/*"]
doc_hits = 16

