# matrix/plan.py check (r3.5): every test names the key that decides its expected
# result, or "silent: <what decides instead>"; a test without one is a problem.
# Set 26 Oct 2026, once all 133 rows had one (Michael).
[matrix]
decides_required = true

# tools/fixed.py, the fixes index: commits reachable from these refs are the
# author's releases (the fork's main carries his commits only) and are never
# listed as untagged.
[fixed]
upstream_refs = ["main", "origin/main"]
# Code commits after check_after with no Issue trailer that Michael accepts as pushed history,
# by sha, each with its reason. Empty until he adds one.
untagged_allow = []
